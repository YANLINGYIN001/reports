<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6pro 价格测试 · 风格预览 B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,900&family=Manrope:wght@500;700;800&family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet">
<style>
/* === FIXED STAGE BASE (viewport-base.css) === */
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0F1A5C}
.deck-viewport{position:fixed;inset:0;overflow:hidden;background:#0F1A5C}
.deck-stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0}
.slide{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;display:block;visibility:hidden;opacity:0;pointer-events:none}
.slide.active,.slide.visible{visibility:visible;opacity:1;pointer-events:auto;z-index:1}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.2s!important}}

/* === EMERALD EDITORIAL === */
.slide{background:#3CD896;color:#0F1A5C;font-family:'Manrope','Noto Serif SC',sans-serif}
.masthead{position:absolute;left:0;right:0;top:96px;text-align:center}
.masthead .rule{height:4px;background:#0F1A5C;margin:0 160px}
.masthead .word{font-family:'Manrope',sans-serif;font-weight:800;font-size:24px;letter-spacing:.42em;padding:18px 0 14px}
.hero{position:absolute;left:0;right:0;top:250px;text-align:center}
.hero .num{font-family:'Bodoni Moda',serif;font-weight:900;font-size:330px;line-height:.95;color:#0F1A5C}
.hero .num .cur{font-size:180px;vertical-align:36px}
.hero .sub{font-family:'Noto Serif SC',serif;font-weight:900;font-size:74px;margin-top:26px;letter-spacing:0}
.hero .sub em{font-style:normal;color:#F1E9D6;background:#0F1A5C;padding:4px 22px}
.paperband{position:absolute;left:0;right:0;bottom:0;height:190px;background:#F1E9D6}
.paperband .inner{display:flex;justify-content:space-between;align-items:center;height:100%;padding:0 160px;border-top:4px solid #0F1A5C}
.pb .k{font-weight:700;font-size:20px;letter-spacing:.18em;color:#3A4593;margin-bottom:8px}
.pb .v{font-family:'Bodoni Moda','Noto Serif SC',serif;font-weight:900;font-size:42px;color:#0F1A5C}
.corner{position:absolute;width:84px;height:84px;border:4px solid #0F1A5C}
.c1{left:56px;top:56px;border-right:none;border-bottom:none}
.c2{right:56px;top:56px;border-left:none;border-bottom:none}
.reveal{opacity:0;transform:translateY(26px);animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
.d1{animation-delay:.1s}.d2{animation-delay:.3s}.d3{animation-delay:.5s}.d4{animation-delay:.7s}.d5{animation-delay:.9s}
@keyframes up{to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="deck-viewport"><div class="deck-stage">
<div class="slide active">
  <div class="corner c1"></div><div class="corner c2"></div>
  <div class="masthead">
    <div class="rule reveal d1"></div>
    <div class="word reveal d2">6PRO 4G 门 铃 · 公 测 收 尾 专 项</div>
    <div class="rule reveal d1"></div>
  </div>
  <div class="hero">
    <div class="num reveal d3"><span class="cur">¥</span>399</div>
    <div class="sub reveal d4">价格测试 <em>PSM 敏感度报告</em></div>
  </div>
  <div class="paperband">
    <div class="inner reveal d5">
      <div class="pb"><div class="k">可接受区间</div><div class="v">¥350 – ¥499</div></div>
      <div class="pb"><div class="k">样本</div><div class="v">19人 全员参与</div></div>
      <div class="pb"><div class="k">数据截至</div><div class="v">2026.09.18</div></div>
    </div>
  </div>
</div>
</div></div>
<script>
function fit(){var s=Math.min(innerWidth/1920,innerHeight/1080);var st=document.querySelector('.deck-stage');st.style.transform='translate('+((innerWidth-1920*s)/2)+'px,'+((innerHeight-1080*s)/2)+'px) scale('+s+')'}
addEventListener('resize',fit);fit();
</script>
</body>
</html>
