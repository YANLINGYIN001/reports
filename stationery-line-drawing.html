<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文具线描作品 · 线条的变化</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
  :root{--ink:#1a1a1a;--paper:#fdfbf6;--gray:#888;--red:#c41e3a;--gold:#d4a843}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Noto Sans SC',sans-serif;background:#e8e0d0;display:flex;justify-content:center;padding:20px;min-height:100vh}
  .frame{width:820px;max-width:100%;background:var(--paper);padding:24px;
    box-shadow:0 4px 30px rgba(0,0,0,.12);border:2px solid var(--ink);border-radius:4px}
  .header{text-align:center;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid var(--ink)}
  .header h1{font-size:24px;letter-spacing:6px;color:var(--ink);margin-bottom:4px}
  .header .sub{font-size:13px;color:var(--gray);letter-spacing:2px}
  .art-area{background:#fff;border:1px solid #ddd;padding:16px;margin-bottom:16px;text-align:center}
  .art-area svg{max-width:100%;height:auto}
  .techniques{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .tech{border:1px solid var(--ink);border-radius:8px;padding:10px;text-align:center;background:#fff}
  .tech h4{font-size:13px;color:var(--ink);margin-bottom:4px}
  .tech p{font-size:11px;color:var(--gray);line-height:1.5}
  .tech svg{margin-bottom:4px;display:block;margin:0 auto}
  .footer{text-align:center;padding-top:10px;border-top:1px dashed var(--gray)}
  .footer p{font-size:12px;color:var(--gray);line-height:1.8}
  .footer .note{color:var(--red);font-size:11px;margin-top:4px}
</style>
</head>
<body>

<div class="frame">
  <div class="header">
    <h1>文 具 线 描</h1>
    <div class="sub">线的变化 · 粗细 · 曲直 · 虚实 · 疏密</div>
  </div>

  <!-- SVG 线描作品 -->
  <div class="art-area">
    <svg width="760" height="520" viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg" style="background:#fff">
      <defs>
        <pattern id="stipple" patternUnits="userSpaceOnUse" width="6" height="6">
          <circle cx="3" cy="3" r="0.8" fill="#333"/>
          <circle cx="1" cy="5" r="0.6" fill="#333"/>
          <circle cx="5" cy="1" r="0.6" fill="#333"/>
        </pattern>
        <pattern id="stipple2" patternUnits="userSpaceOnUse" width="8" height="8">
          <circle cx="4" cy="4" r="0.7" fill="#444"/>
          <circle cx="2" cy="2" r="0.5" fill="#444"/>
          <circle cx="6" cy="6" r="0.5" fill="#444"/>
        </pattern>
      </defs>

      <!-- ===== 铅笔（左上）===== -->
      <g transform="translate(80,60) rotate(-15)">
        <!-- 笔杆主体 -->
        <path d="M 0 30 L 220 30 L 220 50 L 0 50 Z" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
        <!-- 笔杆纹路（疏密线条）-->
        <line x1="20" y1="32" x2="20" y2="48" stroke="#333" stroke-width="0.6"/>
        <line x1="40" y1="32" x2="40" y2="48" stroke="#333" stroke-width="0.6"/>
        <line x1="60" y1="32" x2="60" y2="48" stroke="#333" stroke-width="0.6"/>
        <line x1="80" y1="32" x2="80" y2="48" stroke="#333" stroke-width="0.6"/>
        <line x1="100" y1="32" x2="100" y2="48" stroke="#333" stroke-width="0.6"/>
        <line x1="120" y1="32" x2="120" y2="48" stroke="#333" stroke-width="0.6"/>
        <!-- 笔尖木质（斜线交叉hatching）-->
        <path d="M 220 30 L 280 35 L 290 40 L 280 45 L 220 50 Z" fill="none" stroke="#1a1a1a" stroke-width="2"/>
        <line x1="230" y1="31" x2="235" y2="49" stroke="#333" stroke-width="0.8"/>
        <line x1="240" y1="31" x2="245" y2="49" stroke="#333" stroke-width="0.8"/>
        <line x1="250" y1="32" x2="255" y2="48" stroke="#333" stroke-width="0.8"/>
        <line x1="260" y1="33" x2="265" y2="47" stroke="#333" stroke-width="0.8"/>
        <line x1="270" y1="34" x2="275" y2="46" stroke="#333" stroke-width="0.8"/>
        <!-- 铅芯 -->
        <path d="M 280 35 L 305 38 L 308 40 L 305 42 L 280 45 Z" fill="#1a1a1a"/>
        <!-- 橡皮头 -->
        <rect x="-30" y="28" width="30" height="24" fill="url(#stipple)" stroke="#1a1a1a" stroke-width="2"/>
        <!-- 金属箍 -->
        <rect x="-2" y="28" width="6" height="24" fill="none" stroke="#1a1a1a" stroke-width="2"/>
        <line x1="-1" y1="30" x2="-1" y2="50" stroke="#666" stroke-width="0.5"/>
        <line x1="1" y1="30" x2="1" y2="50" stroke="#666" stroke-width="0.3"/>
        <line x1="3" y1="30" x2="3" y2="50" stroke="#666" stroke-width="0.3"/>
        <!-- 标签 -->
        <text x="110" y="20" fill="#666" font-size="11" font-family="serif">HB</text>
      </g>
      <text x="100" y="180" fill="#999" font-size="12">铅笔 · 粗线轮廓 + 疏密竖线 + 交叉排线</text>

      <!-- ===== 钢笔（右上）===== -->
      <g transform="translate(420,50) rotate(20)">
        <!-- 笔身 -->
        <path d="M 0 25 L 180 25 L 180 50 L 0 50 Z" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
        <!-- 笔身横纹（细密平行线表现光泽）-->
        <line x1="10" y1="27" x2="10" y2="48" stroke="#555" stroke-width="0.3"/>
        <line x1="20" y1="27" x2="20" y2="48" stroke="#555" stroke-width="0.3"/>
        <line x1="30" y1="27" x2="30" y2="48" stroke="#555" stroke-width="0.3"/>
        <line x1="40" y1="27" x2="40" y2="48" stroke="#555" stroke-width="0.3"/>
        <line x1="50" y1="27" x2="50" y2="48" stroke="#555" stroke-width="0.3"/>
        <line x1="60" y1="27" x2="60" y2="48" stroke="#555" stroke-width="0.3"/>
        <line x1="70" y1="27" x2="70" y2="48" stroke="#555" stroke-width="0.3"/>
        <line x1="80" y1="27" x2="80" y2="48" stroke="#555" stroke-width="0.3"/>
        <line x1="90" y1="27" x2="90" y2="48" stroke="#555" stroke-width="0.3"/>
        <line x1="100" y1="27" x2="100" y2="48" stroke="#555" stroke-width="0.3"/>
        <line x1="110" y1="27" x2="110" y2="48" stroke="#555" stroke-width="0.3"/>
        <line x1="120" y1="27" x2="120" y2="48" stroke="#555" stroke-width="0.3"/>
        <line x1="130" y1="27" x2="130" y2="48" stroke="#555" stroke-width="0.3"/>
        <line x1="140" y1="27" x2="140" y2="48" stroke="#555" stroke-width="0.3"/>
        <line x1="150" y1="27" x2="150" y2="48" stroke="#555" stroke-width="0.3"/>
        <line x1="160" y1="27" x2="160" y2="48" stroke="#555" stroke-width="0.3"/>
        <line x1="170" y1="27" x2="170" y2="48" stroke="#555" stroke-width="0.3"/>
        <!-- 笔尖 -->
        <path d="M 180 25 L 225 30 L 235 37 L 225 45 L 180 50 Z" fill="none" stroke="#1a1a1a" stroke-width="2"/>
        <line x1="185" y1="27" x2="215" y2="35" stroke="#333" stroke-width="0.6"/>
        <line x1="185" y1="48" x2="215" y2="40" stroke="#333" stroke-width="0.6"/>
        <line x1="195" y1="27" x2="220" y2="34" stroke="#333" stroke-width="0.5"/>
        <line x1="195" y1="48" x2="220" y2="41" stroke="#333" stroke-width="0.5"/>
        <!-- 笔尖中缝 -->
        <line x1="210" y1="33" x2="233" y2="37.5" stroke="#1a1a1a" stroke-width="1.2"/>
        <!-- 笔帽顶部装饰 -->
        <rect x="-8" y="23" width="10" height="29" fill="none" stroke="#1a1a1a" stroke-width="2"/>
        <line x1="-6" y1="25" x2="-6" y2="50" stroke="#999" stroke-width="0.4"/>
        <line x1="-4" y1="25" x2="-4" y2="50" stroke="#999" stroke-width="0.4"/>
        <line x1="-2" y1="25" x2="-2" y2="50" stroke="#999" stroke-width="0.4"/>
      </g>
      <text x="480" y="170" fill="#999" font-size="12">钢笔 · 细密平行线表现金属光泽</text>

      <!-- ===== 尺子（中间横放）===== -->
      <g transform="translate(80,200) rotate(5)">
        <rect x="0" y="0" width="300" height="40" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
        <!-- 刻度线（长短交替）-->
        <g stroke="#1a1a1a">
          <line x1="20" y1="0" x2="20" y2="15" stroke-width="1.5"/>
          <line x1="40" y1="0" x2="40" y2="10" stroke-width="1"/>
          <line x1="60" y1="0" x2="60" y2="10" stroke-width="1"/>
          <line x1="80" y1="0" x2="80" y2="10" stroke-width="1"/>
          <line x1="100" y1="0" x2="100" y2="15" stroke-width="1.5"/>
          <line x1="120" y1="0" x2="120" y2="10" stroke-width="1"/>
          <line x1="140" y1="0" x2="140" y2="10" stroke-width="1"/>
          <line x1="160" y1="0" x2="160" y2="10" stroke-width="1"/>
          <line x1="180" y1="0" x2="180" y2="15" stroke-width="1.5"/>
          <line x1="200" y1="0" x2="200" y2="10" stroke-width="1"/>
          <line x1="220" y1="0" x2="220" y2="10" stroke-width="1"/>
          <line x1="240" y1="0" x2="240" y2="10" stroke-width="1"/>
          <line x1="260" y1="0" x2="260" y2="15" stroke-width="1.5"/>
          <line x1="280" y1="0" x2="280" y2="10" stroke-width="1"/>
        </g>
        <!-- 数字 -->
        <text x="20" y="28" text-anchor="middle" fill="#333" font-size="9">0</text>
        <text x="100" y="28" text-anchor="middle" fill="#333" font-size="9">5</text>
        <text x="180" y="28" text-anchor="middle" fill="#333" font-size="9">10</text>
        <text x="260" y="28" text-anchor="middle" fill="#333" font-size="9">15</text>
        <!-- 透明感表现（内部虚线）-->
        <line x1="5" y1="35" x2="295" y2="35" stroke="#999" stroke-width="0.5" stroke-dasharray="3,3"/>
      </g>
      <text x="140" y="270" fill="#999" font-size="12">尺子 · 精确直线 + 刻度长短交替</text>

      <!-- ===== 橡皮（中下）===== -->
      <g transform="translate(440,210)">
        <rect x="0" y="0" width="100" height="55" fill="url(#stipple)" stroke="#1a1a1a" stroke-width="2.5"/>
        <!-- 橡皮磨损角 -->
        <path d="M 80 0 L 100 0 L 100 20 L 95 15 L 85 10 Z" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
        <circle cx="88" cy="6" r="0.8" fill="#333"/>
        <circle cx="92" cy="10" r="0.8" fill="#333"/>
        <circle cx="85" cy="12" r="0.6" fill="#333"/>
        <!-- 橡皮标签 -->
        <rect x="15" y="15" width="50" height="25" fill="none" stroke="#333" stroke-width="1"/>
        <text x="40" y="32" text-anchor="middle" fill="#666" font-size="10">ERASER</text>
      </g>
      <text x="460" y="290" fill="#999" font-size="12">橡皮 · 点状纹理（stippling）表现粗糙质感</text>

      <!-- ===== 圆规（右侧）===== -->
      <g transform="translate(600,200) rotate(10)">
        <!-- 主轴 -->
        <line x1="60" y1="10" x2="60" y2="120" stroke="#1a1a1a" stroke-width="3"/>
        <!-- 铰链 -->
        <circle cx="60" cy="10" r="8" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
        <circle cx="60" cy="10" r="3" fill="#1a1a1a"/>
        <!-- 左腿（铅笔腿）-->
        <line x1="60" y1="10" x2="20" y2="120" stroke="#1a1a1a" stroke-width="2.5"/>
        <line x1="20" y1="120" x2="25" y2="135" stroke="#1a1a1a" stroke-width="2"/>
        <!-- 铅笔头 -->
        <path d="M 18 120 L 30 120 L 28 135 L 22 135 Z" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
        <path d="M 23 135 L 25 142 L 27 135 Z" fill="#1a1a1a"/>
        <!-- 右腿（针腿）-->
        <line x1="60" y1="10" x2="100" y2="120" stroke="#1a1a1a" stroke-width="2.5"/>
        <line x1="100" y1="120" x2="98" y2="140" stroke="#1a1a1a" stroke-width="2"/>
        <!-- 针尖 -->
        <path d="M 97 140 L 100 148 L 103 140 Z" fill="#1a1a1a"/>
        <!-- 弧线（圆规画出的圆弧，虚线表现轨迹）-->
        <path d="M 10 145 Q 60 175 110 145" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
      </g>
      <text x="600" y="370" fill="#999" font-size="12">圆规 · 曲线 + 虚线轨迹</text>

      <!-- ===== 笔记本（左下）===== -->
      <g transform="translate(60,330)">
        <!-- 本子主体 -->
        <rect x="0" y="0" width="200" height="140" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
        <!-- 螺旋线圈 -->
        <line x1="0" y1="10" x2="0" y2="130" stroke="#1a1a1a" stroke-width="2"/>
        <circle cx="-5" cy="15" r="5" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
        <circle cx="-5" cy="30" r="5" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
        <circle cx="-5" cy="45" r="5" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
        <circle cx="-5" cy="60" r="5" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
        <circle cx="-5" cy="75" r="5" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
        <circle cx="-5" cy="90" r="5" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
        <circle cx="-5" cy="105" r="5" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
        <circle cx="-5" cy="120" r="5" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
        <!-- 横线（书写线，细虚线）-->
        <line x1="15" y1="25" x2="190" y2="25" stroke="#ccc" stroke-width="0.5" stroke-dasharray="2,2"/>
        <line x1="15" y1="45" x2="190" y2="45" stroke="#ccc" stroke-width="0.5" stroke-dasharray="2,2"/>
        <line x1="15" y1="65" x2="190" y2="65" stroke="#ccc" stroke-width="0.5" stroke-dasharray="2,2"/>
        <line x1="15" y1="85" x2="190" y2="85" stroke="#ccc" stroke-width="0.5" stroke-dasharray="2,2"/>
        <line x1="15" y1="105" x2="190" y2="105" stroke="#ccc" stroke-width="0.5" stroke-dasharray="2,2"/>
        <line x1="15" y1="125" x2="190" y2="125" stroke="#ccc" stroke-width="0.5" stroke-dasharray="2,2"/>
        <!-- 装订孔 -->
        <circle cx="3" cy="15" r="1.5" fill="#fff"/>
        <circle cx="3" cy="45" r="1.5" fill="#fff"/>
        <circle cx="3" cy="75" r="1.5" fill="#fff"/>
        <circle cx="3" cy="105" r="1.5" fill="#fff"/>
      </g>
      <text x="90" y="495" fill="#999" font-size="12">笔记本 · 曲线螺旋线圈 + 虚线书写线</text>

      <!-- ===== 剪刀（中下偏右）===== -->
      <g transform="translate(300,350) rotate(-25)">
        <!-- 左刀刃 -->
        <path d="M 0 20 Q 50 10 110 25 L 110 30 Q 50 20 5 30 Z" fill="none" stroke="#1a1a1a" stroke-width="2"/>
        <!-- 右刀刃 -->
        <path d="M 0 30 Q 50 40 110 25 L 110 20 Q 50 30 5 20 Z" fill="none" stroke="#1a1a1a" stroke-width="2"/>
        <!-- 刀刃交叉hatching表现锋利 -->
        <line x1="60" y1="16" x2="65" y2="22" stroke="#333" stroke-width="0.5"/>
        <line x1="70" y1="17" x2="75" y2="23" stroke="#333" stroke-width="0.5"/>
        <line x1="80" y1="18" x2="85" y2="24" stroke="#333" stroke-width="0.5"/>
        <line x1="90" y1="19" x2="95" y2="25" stroke="#333" stroke-width="0.5"/>
        <!-- 螺丝 -->
        <circle cx="10" cy="25" r="5" fill="none" stroke="#1a1a1a" stroke-width="2"/>
        <line x1="6" y1="25" x2="14" y2="25" stroke="#1a1a1a" stroke-width="1"/>
        <line x1="10" y1="21" x2="10" y2="29" stroke="#1a1a1a" stroke-width="1"/>
        <!-- 左手柄（圆环）-->
        <ellipse cx="-20" cy="15" rx="18" ry="14" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
        <ellipse cx="-20" cy="15" rx="12" ry="9" fill="none" stroke="#333" stroke-width="1"/>
        <!-- 右手柄（圆环）-->
        <ellipse cx="-20" cy="35" rx="18" ry="14" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
        <ellipse cx="-20" cy="35" rx="12" ry="9" fill="none" stroke="#333" stroke-width="1"/>
      </g>
      <text x="300" y="440" fill="#999" font-size="12">剪刀 · 曲线弧线 + 交叉排线</text>

      <!-- ===== 散落的铅笔屑（装饰，展示自由曲线）===== -->
      <g transform="translate(380,310)">
        <path d="M 0 0 Q 8 -5 15 0 Q 22 5 30 -2 Q 35 -8 40 0" fill="none" stroke="#999" stroke-width="1.2"/>
        <path d="M 5 8 Q 12 3 18 8 Q 25 13 32 6" fill="none" stroke="#aaa" stroke-width="1"/>
        <path d="M -5 15 Q 5 10 12 15 Q 20 20 28 14" fill="none" stroke="#999" stroke-width="0.8"/>
      </g>
      <text x="370" y="340" fill="#ccc" font-size="10">铅笔屑 · 自由曲线</text>

      <!-- ===== 标题水印 ===== -->
      <text x="375" y="500" text-anchor="middle" fill="#ddd" font-size="14" font-style="italic">Stationery · Line Drawing</text>
    </svg>
  </div>

  <!-- 线条技法说明 -->
  <div class="techniques">
    <div class="tech">
      <svg width="60" height="30"><line x1="5" y1="15" x2="55" y2="15" stroke="#1a1a1a" stroke-width="3"/></svg>
      <h4>粗线</h4>
      <p>轮廓线、主体结构<br>铅笔笔杆、剪刀外框</p>
    </div>
    <div class="tech">
      <svg width="60" height="30">
        <line x1="5" y1="8" x2="55" y2="8" stroke="#333" stroke-width="0.5"/>
        <line x1="5" y1="14" x2="55" y2="14" stroke="#333" stroke-width="0.5"/>
        <line x1="5" y1="20" x2="55" y2="20" stroke="#333" stroke-width="0.5"/>
      </svg>
      <h4>细密线</h4>
      <p>金属光泽、细节纹理<br>钢笔笔身、尺子刻度</p>
    </div>
    <div class="tech">
      <svg width="60" height="30">
        <line x1="5" y1="5" x2="30" y2="25" stroke="#333" stroke-width="0.6"/>
        <line x1="10" y1="5" x2="35" y2="25" stroke="#333" stroke-width="0.6"/>
        <line x1="15" y1="5" x2="40" y2="25" stroke="#333" stroke-width="0.6"/>
        <line x1="20" y1="5" x2="45" y2="25" stroke="#333" stroke-width="0.6"/>
        <line x1="25" y1="5" x2="50" y2="25" stroke="#333" stroke-width="0.6"/>
      </svg>
      <h4>交叉排线</h4>
      <p>阴影、立体感<br>铅笔木质尖、剪刀刀刃</p>
    </div>
    <div class="tech">
      <svg width="60" height="30">
        <circle cx="8" cy="8" r="0.8" fill="#333"/>
        <circle cx="18" cy="12" r="0.8" fill="#333"/>
        <circle cx="28" cy="6" r="0.8" fill="#333"/>
        <circle cx="38" cy="15" r="0.8" fill="#333"/>
        <circle cx="48" cy="10" r="0.8" fill="#333"/>
        <circle cx="13" cy="20" r="0.8" fill="#333"/>
        <circle cx="25" cy="22" r="0.8" fill="#333"/>
        <circle cx="35" cy="24" r="0.8" fill="#333"/>
        <circle cx="45" cy="22" r="0.8" fill="#333"/>
      </svg>
      <h4>点状纹理</h4>
      <p>粗糙质感<br>橡皮表面（stippling）</p>
    </div>
  </div>

  <div class="footer">
    <p>线描技法：粗细变化 · 曲直对比 · 虚实结合 · 疏密节奏</p>
    <p class="note">★ 纯SVG手绘 · 每种文具展示不同的线条表现技法 ★</p>
  </div>
</div>

</body>
</html>
