<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6pro 价格测试 · 风格预览 A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800;900&family=Nunito:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* === FIXED STAGE BASE (viewport-base.css) === */
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#e8e8e8}
.deck-viewport{position:fixed;inset:0;overflow:hidden;background:#e8e8e8}
.deck-stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:#fff}
.slide{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;display:block;visibility:hidden;opacity:0;pointer-events:none}
.slide.active,.slide.visible{visibility:visible;opacity:1;pointer-events:auto;z-index:1}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.2s!important}}

/* === SWISS MODERN === */
.slide{font-family:'Archivo','Noto Sans SC',sans-serif;color:#000;background:#fff}
.gridline{position:absolute;background:#000;opacity:.12}
.r1{left:120px;top:0;width:2px;height:1080px}
.r2{left:1800px;top:0;width:2px;height:1080px}
.r3{left:0;top:120px;width:1920px;height:2px}
.r4{left:0;top:960px;width:1920px;height:2px}
.kicker{position:absolute;left:120px;top:52px;display:flex;align-items:center;gap:16px;font-family:'Nunito','Noto Sans SC',sans-serif;font-weight:700;font-size:22px;letter-spacing:.14em}
.kicker .sq{width:22px;height:22px;background:#ff3300}
.title{position:absolute;left:120px;top:300px;font-weight:900;font-size:200px;line-height:1.02;letter-spacing:-.01em}
.title .thin{font-weight:500}
.pricechip{position:absolute;right:120px;top:264px;text-align:right}
.pricechip .num{font-weight:900;font-size:170px;color:#ff3300;line-height:1}
.pricechip .lbl{font-family:'Nunito','Noto Sans SC',sans-serif;font-weight:700;font-size:26px;letter-spacing:.2em;margin-top:10px}
.meta{position:absolute;left:120px;bottom:80px;display:flex;gap:80px}
.meta .m .k{font-family:'Nunito','Noto Sans SC',sans-serif;font-size:20px;font-weight:600;color:#777;letter-spacing:.1em;margin-bottom:8px}
.meta .m .v{font-size:30px;font-weight:800}
.bar{position:absolute;left:120px;bottom:200px;width:1680px;height:10px;background:#000}
.bar .seg{position:absolute;left:1042px;width:538px;height:10px;background:#ff3300}
.reveal{opacity:0;transform:translateY(30px);animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}
.d1{animation-delay:.1s}.d2{animation-delay:.25s}.d3{animation-delay:.4s}.d4{animation-delay:.55s}.d5{animation-delay:.7s}.d6{animation-delay:.85s}
@keyframes up{to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="deck-viewport"><div class="deck-stage">
<div class="slide active">
  <div class="gridline r1"></div><div class="gridline r2"></div><div class="gridline r3"></div><div class="gridline r4"></div>
  <div class="kicker reveal d1"><span class="sq"></span>6PRO 4G门铃公测 · 收尾专项</div>
  <div class="title reveal d2">价格测试<br><span class="thin">PSM 敏感度分析</span></div>
  <div class="pricechip reveal d3"><div class="num">¥399</div><div class="lbl">OPTIMAL PRICE POINT</div></div>
  <div class="bar reveal d4"><div class="seg"></div></div>
  <div class="meta reveal d5">
    <div class="m"><div class="k">可接受区间</div><div class="v">¥350 – ¥499</div></div>
    <div class="m"><div class="k">样本</div><div class="v">19人 全员参与</div></div>
    <div class="m"><div class="k">数据截至</div><div class="v">2026.09.18</div></div>
  </div>
</div>
</div></div>
<script>
function fit(){var s=Math.min(innerWidth/1920,innerHeight/1080);var st=document.querySelector('.deck-stage');st.style.transform='translate('+((innerWidth-1920*s)/2)+'px,'+((innerHeight-1080*s)/2)+'px) scale('+s+')'}
addEventListener('resize',fit);fit();
</script>
</body>
</html>
