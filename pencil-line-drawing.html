<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>铅笔线描 · 线条的变化</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
  :root{--ink:#1a1a1a;--paper:#fdfbf6;--gray:#888;--red:#c41e3a}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Noto Sans SC',sans-serif;background:#e8e0d0;display:flex;justify-content:center;padding:20px;min-height:100vh}
  .frame{width:820px;max-width:100%;background:var(--paper);padding:24px;
    box-shadow:0 4px 30px rgba(0,0,0,.12);border:2px solid var(--ink);border-radius:4px}
  .header{text-align:center;margin-bottom:12px;padding-bottom:10px;border-bottom:2px solid var(--ink)}
  .header h1{font-size:22px;letter-spacing:6px;color:var(--ink);margin-bottom:2px}
  .header .sub{font-size:12px;color:var(--gray);letter-spacing:2px}
  .art-area{background:#fff;border:1px solid #ddd;padding:20px;margin-bottom:14px;text-align:center}
  .art-area svg{max-width:100%;height:auto}
  .techniques{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
  .tech{border:1px solid var(--ink);border-radius:8px;padding:8px 6px;text-align:center;background:#fff}
  .tech h4{font-size:12px;color:var(--ink);margin-bottom:4px}
  .tech p{font-size:10.5px;color:var(--gray);line-height:1.5}
  .tech svg{margin:2px auto 4px;display:block}
  .footer{text-align:center;padding-top:8px;border-top:1px dashed var(--gray)}
  .footer p{font-size:12px;color:var(--gray);line-height:1.8}
  .footer .note{color:var(--red);font-size:11px;margin-top:4px}
  .label{font-size:11px;color:#999;font-style:italic;text-align:center;margin-top:6px}
</style>
</head>
<body>

<div class="frame">
  <div class="header">
    <h1>铅 笔 线 描</h1>
    <div class="sub">突出文具特征 · 展现线条的粗细 · 曲直 · 虚实 · 疏密变化</div>
  </div>

  <!-- SVG 铅笔线描 -->
  <div class="art-area">
    <svg width="760" height="360" viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" style="background:#fff">
      <defs>
        <pattern id="stipple" patternUnits="userSpaceOnUse" width="5" height="5">
          <circle cx="2.5" cy="2.5" r="0.6" fill="#333"/>
          <circle cx="1" cy="4" r="0.4" fill="#333"/>
          <circle cx="4" cy="1" r="0.4" fill="#333"/>
        </pattern>
        <pattern id="stipple-light" patternUnits="userSpaceOnUse" width="7" height="7">
          <circle cx="3.5" cy="3.5" r="0.5" fill="#555"/>
          <circle cx="1.5" cy="5.5" r="0.4" fill="#555"/>
        </pattern>
      </defs>

      <!-- ========== 铅笔主体（斜放，从左上到右下） ========== -->
      <g transform="translate(80,40) rotate(-8)">

        <!-- 橡皮头（点状纹理 stippling）-->
        <rect x="-50" y="80" width="55" height="60" fill="url(#stipple)" stroke="#1a1a1a" stroke-width="2.5"/>
        <!-- 橡皮磨损角 -->
        <path d="M -50 80 L -50 95 L -42 88 L -35 82 L -28 80 Z" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
        <circle cx="-44" cy="84" r="0.6" fill="#333"/>
        <circle cx="-40" cy="86" r="0.5" fill="#333"/>
        <circle cx="-46" cy="90" r="0.5" fill="#333"/>
        <!-- 橡皮标签 -->
        <rect x="-42" y="100" width="35" height="22" fill="none" stroke="#555" stroke-width="1"/>
        <text x="-24.5" y="115" text-anchor="middle" fill="#888" font-size="9" font-family="sans-serif">ERASER</text>

        <!-- 金属箍（细密平行线表现金属光泽）-->
        <rect x="5" y="78" width="35" height="64" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
        <line x1="8" y1="80" x2="8" y2="140" stroke="#666" stroke-width="0.4"/>
        <line x1="11" y1="80" x2="11" y2="140" stroke="#666" stroke-width="0.3"/>
        <line x1="14" y1="80" x2="14" y2="140" stroke="#666" stroke-width="0.3"/>
        <line x1="17" y1="80" x2="17" y2="140" stroke="#666" stroke-width="0.3"/>
        <line x1="20" y1="80" x2="20" y2="140" stroke="#666" stroke-width="0.3"/>
        <line x1="23" y1="80" x2="23" y2="140" stroke="#666" stroke-width="0.3"/>
        <line x1="26" y1="80" x2="26" y2="140" stroke="#666" stroke-width="0.3"/>
        <line x1="29" y1="80" x2="29" y2="140" stroke="#666" stroke-width="0.3"/>
        <line x1="32" y1="80" x2="32" y2="140" stroke="#666" stroke-width="0.3"/>
        <line x1="35" y1="80" x2="35" y2="140" stroke="#666" stroke-width="0.4"/>
        <!-- 金属箍上的压纹装饰 -->
        <line x1="10" y1="90" x2="35" y2="90" stroke="#333" stroke-width="0.8"/>
        <line x1="10" y1="130" x2="35" y2="130" stroke="#333" stroke-width="0.8"/>

        <!-- 笔杆主体（粗线轮廓）-->
        <rect x="40" y="82" width="380" height="56" fill="none" stroke="#1a1a1a" stroke-width="3"/>

        <!-- 笔杆标签区 -->
        <rect x="160" y="86" width="140" height="48" fill="none" stroke="#333" stroke-width="1"/>
        <text x="230" y="108" text-anchor="middle" fill="#666" font-size="16" font-family="serif" font-weight="bold">No.2</text>
        <text x="230" y="124" text-anchor="middle" fill="#888" font-size="10" font-family="serif">HB · 2B</text>

        <!-- 笔杆疏密竖线（木纹质感）-->
        <line x1="45" y1="84" x2="45" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="50" y1="84" x2="50" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="55" y1="84" x2="55" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="60" y1="84" x2="60" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="65" y1="84" x2="65" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="70" y1="84" x2="70" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="75" y1="84" x2="75" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="80" y1="84" x2="80" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="85" y1="84" x2="85" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="90" y1="84" x2="90" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="95" y1="84" x2="95" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="100" y1="84" x2="100" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="105" y1="84" x2="105" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="110" y1="84" x2="110" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="115" y1="84" x2="115" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="120" y1="84" x2="120" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="125" y1="84" x2="125" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="130" y1="84" x2="130" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="135" y1="84" x2="135" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="140" y1="84" x2="140" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="145" y1="84" x2="145" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="150" y1="84" x2="150" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="155" y1="84" x2="155" y2="136" stroke="#444" stroke-width="0.5"/>

        <!-- 标签右侧继续竖线 -->
        <line x1="305" y1="84" x2="305" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="310" y1="84" x2="310" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="315" y1="84" x2="315" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="320" y1="84" x2="320" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="325" y1="84" x2="325" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="330" y1="84" x2="330" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="335" y1="84" x2="335" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="340" y1="84" x2="340" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="345" y1="84" x2="345" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="350" y1="84" x2="350" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="355" y1="84" x2="355" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="360" y1="84" x2="360" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="365" y1="84" x2="365" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="370" y1="84" x2="370" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="375" y1="84" x2="375" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="380" y1="84" x2="380" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="385" y1="84" x2="385" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="390" y1="84" x2="390" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="395" y1="84" x2="395" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="400" y1="84" x2="400" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="405" y1="84" x2="405" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="410" y1="84" x2="410" y2="136" stroke="#444" stroke-width="0.5"/>
        <line x1="415" y1="84" x2="415" y2="136" stroke="#444" stroke-width="0.5"/>

        <!-- 木质削尖部分（交叉排线 crosshatching）-->
        <path d="M 420 82 L 520 100 L 540 110 L 520 120 L 420 138 Z" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
        <!-- 第一层斜线 -->
        <line x1="425" y1="84" x2="445" y2="136" stroke="#333" stroke-width="0.7"/>
        <line x1="432" y1="84" x2="452" y2="136" stroke="#333" stroke-width="0.7"/>
        <line x1="439" y1="84" x2="459" y2="136" stroke="#333" stroke-width="0.7"/>
        <line x1="446" y1="84" x2="466" y2="136" stroke="#333" stroke-width="0.7"/>
        <line x1="453" y1="84" x2="473" y2="136" stroke="#333" stroke-width="0.7"/>
        <line x1="460" y1="84" x2="480" y2="136" stroke="#333" stroke-width="0.7"/>
        <line x1="467" y1="84" x2="487" y2="136" stroke="#333" stroke-width="0.7"/>
        <line x1="474" y1="84" x2="494" y2="136" stroke="#333" stroke-width="0.7"/>
        <line x1="481" y1="84" x2="501" y2="136" stroke="#333" stroke-width="0.7"/>
        <line x1="488" y1="88" x2="506" y2="134" stroke="#333" stroke-width="0.6"/>
        <line x1="495" y1="92" x2="510" y2="130" stroke="#333" stroke-width="0.6"/>
        <line x1="502" y1="96" x2="513" y2="126" stroke="#333" stroke-width="0.5"/>
        <line x1="509" y1="100" x2="516" y2="122" stroke="#333" stroke-width="0.5"/>
        <!-- 第二层交叉线（反方向）-->
        <line x1="425" y1="136" x2="445" y2="84" stroke="#555" stroke-width="0.4"/>
        <line x1="435" y1="136" x2="455" y2="84" stroke="#555" stroke-width="0.4"/>
        <line x1="445" y1="136" x2="465" y2="84" stroke="#555" stroke-width="0.4"/>
        <line x1="455" y1="136" x2="475" y2="84" stroke="#555" stroke-width="0.4"/>
        <line x1="465" y1="136" x2="485" y2="84" stroke="#555" stroke-width="0.4"/>
        <line x1="475" y1="136" x2="495" y2="84" stroke="#555" stroke-width="0.4"/>
        <line x1="485" y1="134" x2="500" y2="88" stroke="#555" stroke-width="0.3"/>
        <line x1="495" y1="130" x2="505" y2="92" stroke="#555" stroke-width="0.3"/>

        <!-- 木纹弧线（削铅笔的木纹曲线）-->
        <path d="M 430 100 Q 460 105 490 100" fill="none" stroke="#777" stroke-width="0.6"/>
        <path d="M 435 115 Q 465 120 495 115" fill="none" stroke="#777" stroke-width="0.5"/>

        <!-- 铅芯尖（实心黑色三角）-->
        <path d="M 520 100 L 555 108 L 540 110 L 555 112 L 520 120 Z" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1"/>
        <!-- 铅芯高光（细线留白）-->
        <line x1="525" y1="103" x2="545" y2="109" stroke="#fff" stroke-width="0.8" opacity=".3"/>

        <!-- ===== 铅笔屑（自由曲线，散落在旁边）===== -->
        <g transform="translate(430,160)">
          <!-- 木屑卷曲1 -->
          <path d="M 0 0 Q 15 -8 30 -2 Q 45 5 55 -5 Q 60 -12 50 5 Q 40 12 25 8 Q 10 5 0 0" 
                fill="none" stroke="#999" stroke-width="1.2"/>
          <!-- 木屑卷曲2 -->
          <path d="M 10 18 Q 25 10 40 18 Q 52 25 60 15" 
                fill="none" stroke="#aaa" stroke-width="1"/>
          <!-- 木屑卷曲3 -->
          <path d="M -5 28 Q 10 22 22 30 Q 35 36 45 28" 
                fill="none" stroke="#999" stroke-width="0.9"/>
          <!-- 木屑卷曲4（更小）-->
          <path d="M 5 40 Q 12 35 20 40 Q 26 44 30 38" 
                fill="none" stroke="#bbb" stroke-width="0.8"/>
          <!-- 散落碎屑（点）-->
          <circle cx="35" cy="45" r="0.8" fill="#aaa"/>
          <circle cx="48" cy="48" r="0.6" fill="#aaa"/>
          <circle cx="58" cy="42" r="0.5" fill="#bbb"/>
          <circle cx="62" cy="8" r="0.6" fill="#aaa"/>
          <circle cx="-8" cy="12" r="0.5" fill="#bbb"/>
        </g>

        <!-- ===== 标注引线（虚线）===== -->
        <!-- 指向橡皮 -->
        <line x1="-22" y1="75" x2="-22" y2="45" stroke="#999" stroke-width="0.8" stroke-dasharray="3,2"/>
        <text x="-22" y="38" text-anchor="middle" fill="#888" font-size="10">点状纹理</text>
        <!-- 指向金属箍 -->
        <line x1="22" y1="75" x2="22" y2="45" stroke="#999" stroke-width="0.8" stroke-dasharray="3,2"/>
        <text x="22" y="38" text-anchor="middle" fill="#888" font-size="10">细密平行线</text>
        <!-- 指向笔杆 -->
        <line x1="230" y1="78" x2="230" y2="55" stroke="#999" stroke-width="0.8" stroke-dasharray="3,2"/>
        <text x="230" y="48" text-anchor="middle" fill="#888" font-size="10">疏密竖线（木纹）</text>
        <!-- 指向笔尖 -->
        <line x1="470" y1="78" x2="470" y2="45" stroke="#999" stroke-width="0.8" stroke-dasharray="3,2"/>
        <text x="470" y="38" text-anchor="middle" fill="#888" font-size="10">交叉排线</text>
        <!-- 指向铅芯 -->
        <line x1="545" y1="108" x2="580" y2="95" stroke="#999" stroke-width="0.8" stroke-dasharray="3,2"/>
        <text x="600" y="92" fill="#888" font-size="10">粗线轮廓</text>
        <!-- 指向铅笔屑 -->
        <line x1="460" y1="170" x2="460" y2="195" stroke="#999" stroke-width="0.8" stroke-dasharray="3,2"/>
        <text x="460" y="208" text-anchor="middle" fill="#888" font-size="10">自由曲线</text>

      </g>

      <!-- 底部水印 -->
      <text x="380" y="340" text-anchor="middle" fill="#e8e0d0" font-size="13" font-style="italic">Pencil · Line Drawing</text>
    </svg>
    <div class="label">▾ 一支铅笔 · 六种线条变化 ▾</div>
  </div>

  <!-- 线条技法说明 -->
  <div class="techniques">
    <div class="tech">
      <svg width="50" height="24"><line x1="5" y1="12" x2="45" y2="12" stroke="#1a1a1a" stroke-width="3"/></svg>
      <h4>粗线</h4>
      <p>外轮廓<br>主体结构</p>
    </div>
    <div class="tech">
      <svg width="50" height="24">
        <line x1="5" y1="6" x2="45" y2="6" stroke="#666" stroke-width="0.4"/>

      </svg>
      <h4>细密线</h4>
      <p>金属光泽<br>质感细节</p>
    </div>
    <div class="tech">

        <line x1="5" y1="4" x2="25" y2="20" stroke="#333" stroke-width="0.6"/>

        <circle cx="8" cy="6" r="0.7" fill="#333"/>
        <circle cx="18" cy="10" r="0.7" fill="#333"/>

      <p>粗糙质感<br>橡皮表面</p>
    </div>
    <div class="tech">
      <svg width="50" height="24">
        <path d="M 5 4 Q 15 0 25 6 Q 35 12 45 4" fill="none" stroke="#999" stroke-width="1.2"/>
        <path d="M 3 14 Q 13 10 23 16 Q 33 22 43 14" fill="none" stroke="#aaa" stroke-width="1"/>

      <h4>自由曲线</h4>

    <p>线条变化：粗细对比 · 曲直交替 · 虚实相生 · 疏密节奏</p>

</div>

</body>
</html>
